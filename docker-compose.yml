services:
  api:
    build: .
    image: customer-automation:local
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    # The dedicated `worker` service drives the job queue (and the Gmail
    # poller through it), so the API process does not run one in-process.
    environment:
      QDRANT_URL: http://qdrant:6333
      WORKER_IN_PROCESS: "false"
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    image: customer-automation:local
    command: python -m app.worker
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      WORKER_IN_PROCESS: "false"
      # Only the api container runs migrations (docker/entrypoint.sh).
      RUN_MIGRATIONS: "0"
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_started

  qdrant:
    image: qdrant/qdrant:v1.15.1
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    restart: unless-stopped

  # Not started by default; `docker compose up postgres` gives you a local
  # Postgres for fully offline development (DATABASE_URL must then point at
  # postgresql://postgres:postgres@postgres:5432/co in your .env).
  postgres:
    profiles: ["dev-db"]
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: co
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  qdrant_data:
  postgres_data:
