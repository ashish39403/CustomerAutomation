name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync dependencies (uv.lock)
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check .

  test:
    name: Tests (pytest + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: customerautomation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d customerautomation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/customerautomation
      APP_ENV: test
      APP_SECRET_KEY: ci-insecure-secret-key
      DASHBOARD_USERNAME: admin
      DASHBOARD_PASSWORD: ci-admin-password-123
      # The tests must not drive the job queue / Gmail poller themselves.
      WORKER_IN_PROCESS: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync dependencies (uv.lock)
        run: uv sync --frozen

      - name: Apply DB migrations
        run: uv run alembic upgrade head

      - name: Run pytest
        run: uv run pytest -q

  build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: customer-automation:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

# NOTE: GHCR push aur server deploy workflows ki zarurat jab deployment
# setting up hone lage (docs/CI_CD.md me plan likha hai), tab add karenge.

