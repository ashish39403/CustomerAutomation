name: Deploy

# Manual deploy button + automatic deploy on every push to main.
# Nothing runs until the repo has DEPLOY_HOST / DEPLOY_USER set in
# Settings > Secrets and variables > Actions > Variables — until then this
# workflow is skipped (see the `if` below).
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to production server
    runs-on: ubuntu-latest
    if: vars.DEPLOY_HOST != '' && vars.DEPLOY_USER != ''
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      # The server must have completed once:
      #   docker login ghcr.io -u <github-username> -p <github-PAT-with-read:packages>
      # and a docker-compose.yml that references:
      #   api:
      #     image: ghcr.io/<owner>/customerautomation:latest   (lowercase)
      #   worker:
      #     image: ghcr.io/<owner>/customerautomation:latest
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ vars.DEPLOY_DIR }}
            docker compose pull api worker
            docker compose up -d --remove-orphans
            docker image prune -f
            docker compose ps
