[project]
name = "customerautomation"
version = "0.1.0"
description = "AI e-commerce customer support automation backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "bcrypt>=5.0.0",
    "boto3>=1.43.123",
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.162.0",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.0",
    "google-auth-oauthlib>=1.5.0",
    "itsdangerous>=2.2.0",
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "langchain-qdrant>=1.0.0",
    "langchain-text-splitters>=1.0.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "qdrant-client>=1.20.0",
    "sqlalchemy>=2.1.6",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
]

[dependency-groups]
dev = [
    "google-auth-oauthlib>=1.5.0",
    "ipykernel>=7.4.0",
    "langsmith>=0.14.9,<1.0.0",
    "nest-asyncio>=1.6.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# E501 off: AI prompts and reply-template strings are intentionally long.
# Hard-wrapping them inside quotes would change the text the model receives.
ignore = ["E501"]
